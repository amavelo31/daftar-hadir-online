<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Pesan Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>💬 Pesan Online</h2>
        <form id="formPesan">
            <input type="text" id="nama" placeholder="Nama Anda" required>
            <textarea id="isiPesan" placeholder="Tulis pesan Anda di sini..." rows="3" required></textarea>
            <button type="submit">Kirim Pesan</button>
        </form>

        <h3>Dinding Pesan</h3>
        <div id="papanPesan"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
